[package]
name = "nested"
version = "0.2.15"
description = "A calm research reader for Markdown notes"
authors = ["True Frontier"]
edition = "2021"

[lib]
name = "nested_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
freshjuice-tauri-aptabase = { version = "2.0.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native"] }
walkdir = "2"
chrono = "0.4"
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# ⌘O shows one Open panel for a folder or a single Markdown file. rfd, behind the dialog
# plugin, cannot do both in one panel, so macOS talks to NSOpenPanel directly.
# NSWorkspace (with UTType and a completion block) reads and sets the default app for Markdown.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-uniform-type-identifiers", "NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSError", "NSString", "NSURL"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }

[features]
default = ["aptabase"]
aptabase = ["dep:freshjuice-tauri-aptabase"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
