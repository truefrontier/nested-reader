[package]
name = "markdown-learner"
version = "0.1.0"
description = "A calm research reader for Markdown notes"
authors = ["True Frontier"]
edition = "2021"

[lib]
name = "markdown_learner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native"] }
walkdir = "2"
chrono = "0.4"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
