# Claude answers when someone writes @claude in an issue, a pull request, or a review comment.
# It reads the thread and the code, replies, and can open a branch with the change when asked.
#
# Needs: the Claude GitHub App installed on this repo (run /install-github-app in Claude Code)
# and a CLAUDE_CODE_OAUTH_TOKEN secret under Settings › Secrets and variables › Actions
# (from `claude setup-token`; bills Kevin's Claude subscription).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only runs when the text mentions @claude, so ordinary comments cost nothing.
    # Restricted to kevnk (repo maintainer) or OWNER to prevent unauthorized usage.
    # A new issue labelled "feedback" is skipped: the relay files those under the token owner's
    # account (kevnk), but anyone on the internet wrote the text. Kevin can still @claude in a comment.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && (github.event.comment.user.login == 'kevnk' || github.event.comment.author_association == 'OWNER')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && (github.event.comment.user.login == 'kevnk' || github.event.comment.author_association == 'OWNER')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && (github.event.review.user.login == 'kevnk' || github.event.review.author_association == 'OWNER')) ||
      (github.event_name == 'issues' && !contains(github.event.issue.labels.*.name, 'feedback') && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && (github.event.issue.user.login == 'kevnk' || github.event.issue.author_association == 'OWNER'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The repo is public, so anyone can comment on an issue or PR. The `if:` above checks who
          # wrote the @claude, but the action reads the whole thread into the prompt. Keep only
          # kevnk's comments and Claude's own replies, so a stranger's comment can't steer a run
          # that has contents: write and runs pnpm and cargo. PR review bodies aren't filtered by
          # this setting, so don't @claude on a stranger's review.
          include_comments_by_actor: "kevnk,claude[bot]"
          # Lets Claude read CI results when a PR check fails.
          additional_permissions: |
            actions: read
          # WebFetch is pinned to the two GitHub hosts so Claude can read a linked
          # repo's README/source when an issue points at one. Kept narrow on purpose:
          # this job runs with contents:write on a private checkout, so an open fetch
          # tool (or Bash curl / gh api) would give injected text in an issue body a
          # way to send code back out. Add a host here only when something needs it.
          claude_args: |
            --allowedTools "Bash(pnpm install),Bash(pnpm build),Bash(pnpm dev),Bash(npx tsc:*),Bash(cargo check:*),Bash(cargo test:*),Bash(git:*),WebFetch(domain:github.com),WebFetch(domain:raw.githubusercontent.com)"
