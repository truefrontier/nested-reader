name: Astra Release
on:
  push:
    branches: [astra]
    tags: ['astra-v*']
  workflow_dispatch:

concurrency:
  group: astra-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/astra' || startsWith(github.ref, 'refs/tags/astra-v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package Mac (ad-hoc)
        run: npm run package:mac
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astra-mac
          path: |
            release/Nested-arm64.zip
            release/SHA256SUMS
            release/website/**
          if-no-files-found: error
      - name: Version for release
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="astra-v${V}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release (tag pushes or dispatch on astra)
        if: startsWith(github.ref, 'refs/tags/astra-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/astra-v') && github.ref_name || steps.ver.outputs.tag }}
          name: Nested Astra ${{ steps.ver.outputs.version }}
          files: |
            release/Nested-arm64.zip
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
